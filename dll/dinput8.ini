; BFME2 faction unlocker. Lives next to dinput8.dll in the game folder.
; 1 = on, 0 = off. Deleting this file means: everything at its default.

[FactionUnlocker]
; Master switch. 0 = load and forward dinput8 only, patch nothing.
Enabled=1
; 1 = locate and verify every enabled patch, write the log, change nothing.
DryRun=0
; 1 = write dinput8.log next to the DLL on every start.
Log=1

[Patches]
; A  Selecting a faction keeps it instead of jumping to the first playable one.
A=1
; C  A PlayerTemplate whose Side repeats an existing playable Side stays playable.
C=1
; D  Lobby faction dropdown ignores the map start position's AllowedFactions.
D=1
; E  AI / Random faction pick ignores the map start position's AllowedFactions.
E=1
; B  (optional) Random is no longer turned into the first playable faction when
;    the game's faction-restriction flag (GlobalData+0x9D4 & 3) is set.
B=0
; C2 (optional) Ignore the Dwarves/Wild-only side restriction mode
;    (GlobalData+0x9D4 = 1..2) while parsing PlayerTemplates.
C2=0
; S1 and S3 make the [Sides] aliases below work. They are only installed
; when [Sides] has at least one entry.
; S1 Faction id of a Side (Create-A-Hero, rank icons, stats) -> donor's.
S1=1
; S3 Rank skill-point thresholds -> donor's.
S3=1
; S2 and S4: an AI whose Side has no skirmish player on the map (no
; Skirmish<Side> in WorldBuilder) is matched to its [Sides] donor's, else to
; the first game Side the map has, instead of standing idle. Its base still
; comes from skirmishaidata.ini by its own Side. Installed together or not
; at all; [Sides] is not needed.
; S2 Which map skirmish player the AI copies its build list and teams from.
S2=1
; S4 Whether a computer player gets a skirmish AI at all.
S4=1

[Sides]
; NewSide=DonorSide: a PlayerTemplate with Side = NewSide is treated as
; DonorSide by the engine's hardcoded per-Side code. ASCII letters, digits
; and _ only, up to 31 characters, case-insensitive, at most 32 entries.
; NewSide must not be one of the game's own Sides; the log lists them (Age
; of the Ring already has Rohan, Dale, Dunland, ... of its own).
; Example:
;Rohan=Men
;Harad=Mordor
