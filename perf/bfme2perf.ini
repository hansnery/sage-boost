; bfme2perf: performance plugin for BFME2 / ROTWK. Lives next to bfme2perf.asi
; in the game's mss\ folder. 1 = on, 0 = off. Deleting this file means: defaults.

[Perf]
; Master switch. 0 = load, hook nothing.
Enabled=1
; 1 = write bfme2perf.log on every start.
Log=1

[Timing]
; 1 = write bfme2perf_timing.csv, one row per second.
Enabled=1
; 1 = also time each mesh and count draw calls. 0 = leave those out, to
; measure what they cost.
Detail=1

[Render]
; Redraw the water reflection only every Nth frame and reuse it in between.
; 1 = every frame, as in the game (no hook). 2..4 allowed.
ReflectionInterval=1
; Redraw the shadow map only every Nth frame; in between the shadows come
; from the stored map, with the matrix that matches it. Moving units' shadows
; can trail by up to N-1 frames. 1 = every frame, as in the game (no hook).
; 2..4 allowed. While a building is being placed it is drawn every frame.
ShadowInterval=1
; 1 = also draw the shadow map every frame while the camera scrolls (no
; missing strip at the screen edge, but no saving while scrolling).
ShadowFullWhileScrolling=0
; Batching of identical unit meshes. Not in this build: 0 and 1 both draw as
; the game does. With [Timing] Enabled=1 the CSV counts what it could merge.
Batching=0
; Faster insertion into rendering queues when storage is already available.
; Enabled only when the complete native insertion contract is verified.
; Full queues and unsupported inputs use the game's original insertion.
QueueInsert=1
; Instancing of unit meshes: in each group of identical meshes the first is
; drawn by the game and the rest in a few draws with the plugin's own vertex
; shader. 0 = off, as in the game (no hook). 1 = on.
Instancing=0
; With Instancing=1: every 5 s a few groups are drawn both ways off screen and
; compared (see bfme2perf.log); a shader kind that differs twice is switched
; off for the session. 0 = no checks.
InstancingVerify=1
; With Instancing=1: also instance the unit meshes the game draws into the
; shadow map (its depth-only shaders; checked like the others, against the
; game's draw in the shadow map's own format). 1 = on. 0 = the game draws
; every mesh of the shadow map, the rest stays instanced.
ShadowInstancing=1
; Draw extra frames between the game's own frames, in the time it would
; otherwise wait: 30 = off (the game as it is), 60, 90 or 120. Logic, input
; and the network stay on the game's 30. Extra frames turn themselves off
; for the session if any check fails (see bfme2perf.log), and pause for a
; while when one made a game frame late; if that keeps happening they rest
; 1, then 2, then 4 minutes, and the 4th time stay off for the session.
MaxFPS=30
; What an extra frame moves: 0 or 1 = nothing (the last frame again),
; 2 = moving units, ahead of the last game frame. 3 = moving units, between
; the last two game frames (the game's own frames show them one frame, 33 ms,
; behind while extra frames are drawn: no overshoot when a unit stops or
; turns, but its health bar and selection ring lead by that much; with no
; extra frames for a moment the delay eases out and units are drawn as the
; game has them).
; The camera is never moved: every frame shows it where the game has it (the
; shadows and the ground are prepared for that camera only).
; Particles and other effects always stay at the game's 30 per second.
FrameSmoothing=3
; With MaxFPS above 30: 1 = every extra frame also redraws the shadow map,
; from where it moved the units, so shadows keep up with them (no trailing
; shadows; set ShadowInterval=1 as well to have none at all). Costs a shadow
; pass per extra frame, so fewer extra frames fit. With ShadowInterval=1,
; regular frames redraw too; with a larger interval, a regular frame right
; after an extra reuses its map. 0 = extra frames reuse the
; last game frame's shadow map (shadows move at 30 per second).
ExtraFrameShadows=0
; The same for the water reflection. 0 = reused from the last game frame.
ExtraFrameReflections=0
; Shadow map: units of the same model and material are set up as one group
; even when their lighting differs (the shadow map's shaders don't use the
; lighting or the fog colour; checked for every effect the game ships; the
; game's and the mod's archives are checked while the game loads, and it
; stays off if the game could load any other). The map is the same, and the
; lighting the shadow map leaves set on the device is the game's too (each
; merged group stores the lighting the game's own groups would have left).
; 1 = on. 0 = the game's groups.
ShadowBatchIgnoreLight=1
; Big monsters (trolls, mumakil, ents, eagles...: SHADOW_VOLUME_NON_SELF)
; are drawn on their own between two flushes that only stencil shadow
; volumes need. 1 = not in the shadow map (the map is the same). 2 = not in
; the other passes either, while shadow mapping (not stencil shadows) is on:
; nothing reads those stencil bits then, but semi-transparent parts may be
; drawn in another order. 0 = as in the game.
NoStencilFlushes=1
; Shadow map: skip the particle walk (no particle is drawn into the shadow
; map anyway) and leave what it would leave. 1 = only when it can't add a
; heat-haze smudge (then the result is exactly the game's). 2 = always (the
; heat-haze screen effect may then go by the previous pass's smudge count).
; 0 = as in the game.
ShadowSkipParticles=1
; 1 = every 10 s draw the shadow map twice, with one of the three settings
; above off and then on, compare the two maps and the particle bookkeeping,
; and log both times (bfme2perf.log); a setting that differs twice is
; switched off. Costs one extra shadow pass every 10 s. 0 = no checks.
; It checks LightSkipShadow below too, when that is on.
ShadowPassVerify=0
; Every object's lighting (the lights that reach it) is worked out again in
; each pass: shadow map, water reflection and the main view. The three
; settings below cut that work and leave every light, its order and every
; value the game hands on exactly as the game makes them.
; Shadow map: don't work out the lighting at all (its shaders don't use it);
; objects get the scene's default lighting, as the game gives an object no
; light reaches. 1 = on. 0 = as in the game (the default: the shadow map
; then leaves the device lit with the default lighting instead of the last
; unit's, and that can't be put back without the work this cut saves; no
; draw that would see it is known, but that isn't proven. With [Timing]
; Enabled=1, lt_stale_draws in the timing CSV counts the draws that could).
LightSkipShadow=0
; Look at the scene's lights and the effects' dynamic lights once per pass
; instead of once per object, then give each object the lights the game's
; own test keeps, in the game's order. 1 = on. 0 = the game's loops.
LightCull=1
; An object whose lighting inputs are exactly those of an earlier pass or
; frame (its own position and lighting before the light lists, every light
; that reaches it unchanged) gets that result instead of adding each light
; again. Needs LightCull=1. 1 = on (about 3 MB). 0 = off.
LightReuse=1
; 1 = every 5 s, 8 objects get their lighting both ways (the game's and the
; plugin's) and the two are compared byte for byte; a cut that differs
; twice is switched off for the session (bfme2perf.log). 0 = no checks.
LightVerify=1

[CatchUp]
; When the game falls behind (frames take longer than the 33 ms the game
; counts on, so the battle runs slow), skip the drawing of some frames so the
; game keeps its full speed. Only the picture is skipped: every frame still
; runs logic, the network, input, the UI and sound, so the game, replays and
; multiplayer are exactly as without it; you see a few frames fewer instead
; of a slower battle. Never in menus, while paused or loading, while placing
; a building or scrolling the camera. 1 = on. 0 = the game as it is.
Enabled=1
; Frames skipped in a row at most. 1 = never two in a row (at least every
; other frame is drawn). 2 or 3 keep full speed in heavier battles, with
; fewer frames drawn.
MaxSkips=1
; 1 = show a small notice in the top right corner while the game is catching
; up (see NoticeMinSkips; it stays 2 seconds after). 0 = no notice.
Notice=1
; The notice's text, plain ASCII letters only (accents show as '?'); "..."
; is added at the end. "Catching up" when empty.
NoticeText=Recuperando atraso
; Frames skipped within 2 seconds before the notice shows, 1..30. Once shown,
; half that many keep it. 6 = only when the game keeps falling behind, not
; for a stutter's skip or two. 1 = at every skipped frame.
NoticeMinSkips=6

[Skeleton]
; Workers for the skeleton pre-pass (not in this build: read and logged only).
; 0 = off. -1 = one fewer than the logical cores. 1..4 = that many.
Threads=0
; 1 = recompute every pose on the main thread and compare. Testing only.
Verify=0
